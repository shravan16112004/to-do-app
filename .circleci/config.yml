version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.14

    steps:
      - checkout

      - run:
          name: Install Dependencies
          command: npm ci

      - run:
          name: Run Tests
          command: npm test

      - run:
          name: Build React Application
          command: npm run build

  build-and-push-image:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - run:
          name: Build Docker Image
          command: |
            docker build \
              -t ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/todo-app:${CIRCLE_SHA1} .

      - run:
          name: Login to Amazon ECR
          command: |
            aws ecr get-login-password \
              --region ${AWS_REGION} | \
            docker login \
              --username AWS \
              --password-stdin \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

      - run:
          name: Push Docker Image to ECR
          command: |
            docker push \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/todo-app:${CIRCLE_SHA1}

workflows:
  build-test-push:
    jobs:
      - build-and-test

      - build-and-push-image:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main
