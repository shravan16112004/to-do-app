version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.14

    steps:
      - checkout

      - run:
          name: Install Dependencies
          command: npm ci

      - run:
          name: Run Tests
          command: npm test

      - run:
          name: Build React Application
          command: npm run build

  build-and-push-image:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - run:
          name: Build Docker Image
          command: |
            docker build \
              -t ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/todo-app:${CIRCLE_SHA1} .

      - run:
          name: Login to Amazon ECR
          command: |
            aws ecr get-login-password \
              --region ${AWS_REGION} | \
            docker login \
              --username AWS \
              --password-stdin \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

      - run:
          name: Push Docker Image to ECR
          command: |
            docker push \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/todo-app:${CIRCLE_SHA1}

      - run:
          name: Update Kubernetes Manifest
          command: |
            IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/todo-app:${CIRCLE_SHA1}"

            sed -i "s|image: .*|image: ${IMAGE}|" k8s/deployment.yaml

            echo "Updated Kubernetes image:"
            grep "image:" k8s/deployment.yaml

                  - run:
          name: Commit Updated Kubernetes Manifest
          command: |
            git config --global user.name "circleci"
            git config --global user.email "circleci@users.noreply.github.com"

            git add k8s/deployment.yaml

            if ! git diff --cached --quiet; then
              git commit -m "Update Kubernetes image to ${CIRCLE_SHA1} [skip ci]"

              if [ -z "${GITHUB_TOKEN}" ]; then
                echo "ERROR: GITHUB_TOKEN is not configured in CircleCI."
                exit 1
              fi

              echo "GitHub token detected."

              git config --global --unset-all credential.helper || true

              git -c credential.helper= \
                push "https://x-access-token:${GITHUB_TOKEN}@github.com/shravan16112004/to-do-app.git" HEAD:main

            else
              echo "No Kubernetes manifest changes detected."
            fi

workflows:
  build-test-push:
    jobs:
      - build-and-test

      - build-and-push-image:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main
