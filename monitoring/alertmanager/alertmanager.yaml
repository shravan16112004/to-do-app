global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - app
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: slack-notifications

  routes:
    - receiver: "null"
      matchers:
        - alertname="Watchdog"

receivers:
  - name: "null"

  - name: "slack-notifications"
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_api_url
        channel: "#new-channel"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: |
          *Alert:* {{ .CommonLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *App:* {{ .CommonLabels.app }}
          *Description:* {{ or .CommonAnnotations.description .CommonAnnotations.summary }}
