apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todo-app-alerts
  namespace: monitoring
  labels:
    release: monitoring-stack

spec:
  groups:
    - name: todo-app.rules
      rules:

        # 1. Todo App pod count is below desired replicas
        - alert: TodoAppPodDown
          expr: |
            sum(
              kube_pod_status_phase{
                namespace="todo-app",
                phase="Running"
              }
            ) < 2
          for: 30s
          labels:
            severity: critical
            app: todo-app
          annotations:
            summary: "Todo App pod is down"
            description: "The Todo App has fewer than 2 running pods for more than 1 minute."

        # 2. Todo App pod is restarting
        - alert: TodoAppPodRestarting
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace="todo-app"
              }[10m]
            ) > 0
          for: 2m
          labels:
            severity: warning
            app: todo-app
          annotations:
            summary: "Todo App pod is restarting"
            description: "A Todo App container has restarted within the last 10 minutes."

        # 3. Todo App pod is not ready
        - alert: TodoAppPodNotReady
          expr: |
            sum(
              kube_pod_status_ready{
                namespace="todo-app",
                condition="true"
              }
            ) < 2
          for: 30s
          labels:
            severity: warning
            app: todo-app
          annotations:
            summary: "Todo App pod is not ready"
            description: "The Todo App has fewer than 2 ready pods for more than 2 minutes."

        # 4. CrashLoopBackOff
        - alert: TodoAppCrashLoopBackOff
          expr: |
            kube_pod_container_status_waiting_reason{
              namespace="todo-app",
              reason="CrashLoopBackOff"
            } == 1
          for: 2m
          labels:
            severity: critical
            app: todo-app
          annotations:
            summary: "Todo App is in CrashLoopBackOff"
            description: "A Todo App container is repeatedly crashing."

        # 5. OOMKilled
        - alert: TodoAppOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              namespace="todo-app",
              reason="OOMKilled"
            } == 1
          for: 1m
          labels:
            severity: critical
            app: todo-app
          annotations:
            summary: "Todo App container was OOMKilled"
            description: "A Todo App container was terminated because it exceeded its memory limit."

        # 6. High CPU
        - alert: TodoAppHighCPU
          expr: |
            sum by (pod) (
              rate(
                container_cpu_usage_seconds_total{
                  namespace="todo-app",
                  container!="",
                  container!="POD"
                }[5m]
              )
            ) > 0.4
          for: 5m
          labels:
            severity: warning
            app: todo-app
          annotations:
            summary: "Todo App CPU usage is high"
            description: "A Todo App pod has sustained CPU usage above 400m."

        # 7. High memory
        - alert: TodoAppHighMemory
          expr: |
            sum by (pod) (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container!="",
                container!="POD"
              }
            ) > 200000000
          for: 5m
          labels:
            severity: warning
            app: todo-app
          annotations:
            summary: "Todo App memory usage is high"
            description: "A Todo App pod is using more than 200MB of memory for over 5 minutes."

        # 8. Deployment replica mismatch
        - alert: TodoAppDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{
              namespace="todo-app",
              deployment="todo-app"
            }
            !=
            kube_deployment_status_replicas_available{
              namespace="todo-app",
              deployment="todo-app"
            }
          for: 5m
          labels:
            severity: warning
            app: todo-app
          annotations:
            summary: "Todo App replica count mismatch"
            description: "The Todo App deployment does not have the expected number of available replicas."

        # 9. Deployment rollout stuck
        - alert: TodoAppDeploymentRolloutStuck
          expr: |
            kube_deployment_status_replicas_updated{
              namespace="todo-app",
              deployment="todo-app"
            }
            <
            kube_deployment_spec_replicas{
              namespace="todo-app",
              deployment="todo-app"
            }
          for: 10m
          labels:
            severity: critical
            app: todo-app
          annotations:
            summary: "Todo App deployment rollout is stuck"
            description: "The Todo App deployment has not updated all expected replicas for 10 minutes."

        # 10. Kubernetes node not ready
        - alert: EKSNodeNotReady
          expr: |
            kube_node_status_condition{
              condition="Ready",
              status="true"
            } == 0
          for: 1m
          labels:
            severity: critical
            app: todo-app
          annotations:
            summary: "EKS node is not ready"
            description: "A Kubernetes node has been NotReady for more than 5 minutes."

        # 11. Kubernetes node high CPU
        - alert: EKSNodeHighCPU
          expr: |
            (
              1 -
              avg by (instance) (
                rate(
                  node_cpu_seconds_total{
                    mode="idle"
                  }[5m]
                )
              )
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            app: todo-app
          annotations:
            summary: "EKS node CPU usage is high"
            description: "An EKS node has CPU utilization above 80% for more than 10 minutes."

        # 12. Kubernetes node high memory
        - alert: EKSNodeHighMemory
          expr: |
            (
              1 -
              (
                node_memory_MemAvailable_bytes
                /
                node_memory_MemTotal_bytes
              )
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            app: todo-app
          annotations:
            summary: "EKS node memory usage is high"
            description: "An EKS node has memory utilization above 80% for more than 10 minutes."

        - alert: TodoAppPodDisruption
          expr: |
            changes(
              kube_pod_status_phase{
                namespace="todo-app",
                pod=~"todo-app-.*"
              }[2m]
            ) > 0
          for: 0s
          keep_firing_for: 2m
          labels:
            severity: warning
            app: todo-app
          annotations:
            summary: "Todo App pod was deleted or recreated"
            description: "A Todo App pod was deleted, recreated, or changed state."


